name: Korlink Training Update AI

on:
  schedule:
    # Every day at 4:00 AM Nigeria Time (3:00 AM UTC)
    - cron: "0 3 * * *"

    # Every day at 4:00 PM Nigeria Time (15:00 PM UTC)
    - cron: "0 15 * * *"

  workflow_dispatch:
    inputs:
      run_mode:
        description: "Choose what to run"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening

jobs:
  training-update:
    runs-on: ubuntu-latest

    steps:
      # ====================================================
      # CHECKOUT
      # ====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ====================================================
      # SETUP PYTHON
      # ====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ====================================================
      # INSTALL DEPENDENCIES
      # ====================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ====================================================
      # DETERMINE RUN MODE
      # ====================================================
      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.run_mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 3 * * *" ]; then
            echo "mode=morning" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 15 * * *" ]; then
            echo "mode=evening" >> "$GITHUB_OUTPUT"
          else
            echo "mode=morning" >> "$GITHUB_OUTPUT"
          fi

      # ====================================================
      # SHOW RUN INFORMATION
      # ====================================================
      - name: Show run information
        run: |
          echo "=============================================="
          echo "KORLINK TRAINING UPDATE AI"
          echo "=============================================="
          echo "Run mode: ${{ steps.mode.outputs.mode }}"
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "=============================================="

      # ====================================================
      # RUN AI ENGINE
      # ====================================================
      - name: Run Korlink Training Update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          python main.py

      # ====================================================
      # SAVE GENERATED DATA
      # ====================================================
      - name: Save generated logs
        run: |
          git config user.name "Korlink Training Bot"
          git config user.email "actions@github.com"
          git add logs/
          git diff --cached --quiet || git commit -m "Update training content"
          git push
