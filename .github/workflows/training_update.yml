
name: Korlink Training Update AI

on:
  schedule:
    # Monday-Friday: 4:00 AM Nigeria time (WAT / UTC+1)
    - cron: "0 3 * * 1-5"

    # Monday-Friday: 4:00 PM Nigeria time (WAT / UTC+1)
    - cron: "0 15 * * 1-5"

    # Saturday: 4:00 AM Nigeria time (WAT / UTC+1)
    - cron: "0 3 * * 6"

    # Sunday: 4:00 AM Nigeria time (WAT / UTC+1)
    - cron: "0 3 * * 0"

  workflow_dispatch:
    inputs:
      run_mode:
        description: "Select the type of update to run"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening
          - weekend

permissions:
  contents: write

concurrency:
  group: korlink-training-update
  cancel-in-progress: false

jobs:
  training-update:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # DETERMINE RUN MODE
      # ============================================================

      - name: Determine run mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.run_mode }}
        run: |
          set -e

          echo "Event: $EVENT_NAME"

          MODE=""

          # --------------------------------------------------------
          # MANUAL RUN
          # --------------------------------------------------------

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then

            MODE="$MANUAL_MODE"

            echo "Manual workflow execution detected."
            echo "Selected mode: $MODE"

          # --------------------------------------------------------
          # SCHEDULED RUN
          # --------------------------------------------------------

          elif [ "$EVENT_NAME" = "schedule" ]; then

            echo "Scheduled workflow execution detected."
            echo "Cron schedule: $SCHEDULE"

            # Use the original cron expression.
            # This prevents delayed GitHub Actions starts
            # from causing a time-validation failure.

            case "$SCHEDULE" in

              "0 3 * * 1-5")
                MODE="morning"
                ;;

              "0 15 * * 1-5")
                MODE="evening"
                ;;

              "0 3 * * 6"|"0 3 * * 0")
                MODE="weekend"
                ;;

              *)
                echo "Unknown scheduled cron: $SCHEDULE"
                exit 1
                ;;

            esac

          else

            echo "Unsupported event: $EVENT_NAME"
            exit 1

          fi

          # --------------------------------------------------------
          # VALIDATE MODE
          # --------------------------------------------------------

          case "$MODE" in

            morning)
              echo "RUN_MODE=morning" >> "$GITHUB_ENV"
              ;;

            evening)
              echo "RUN_MODE=evening" >> "$GITHUB_ENV"
              ;;

            weekend)
              echo "RUN_MODE=weekend" >> "$GITHUB_ENV"
              ;;

            *)
              echo "Invalid RUN_MODE: $MODE"
              exit 1
              ;;

          esac

          echo "Selected run mode: $MODE"

      # ============================================================
      # RUN KORLINK TRAINING UPDATE
      # ============================================================

      - name: Run training update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ env.RUN_MODE }}
        run: |
          echo "Starting Korlink Training Update..."
          echo "RUN_MODE=$RUN_MODE"

          python main.py

      # ============================================================
      # COMMIT LOGS
      # ============================================================

      - name: Commit generated logs
        shell: bash
        run: |
          git config user.name "Korlink Technologies"
          git config user.email "actions@users.noreply.github.com"

          git add -A logs/

          if git diff --cached --quiet; then
            echo "No log changes to commit."
            exit 0
          fi

          git commit -m "Update training content logs"

      # ============================================================
      # PUSH LOGS
      # ============================================================

      - name: Push logs
        shell: bash
        run: |
          git push
