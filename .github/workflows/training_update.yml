name: Korlink Training Update AI

on:
  schedule:

    # Monday - Friday
    # 7:50 AM Nigeria time (WAT / UTC+1)
    - cron: "50 6 * * 1-5"

    # Monday - Friday
    # 6:50 PM Nigeria time (WAT / UTC+1)
    - cron: "50 17 * * 1-5"

    # Saturday - 8:00 AM WAT
    - cron: "0 7 * * 6"

    # Sunday - 8:00 AM WAT
    - cron: "0 7 * * 0"

  workflow_dispatch:
    inputs:
      run_mode:
        description: "Choose what to run"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening
          - weekend

jobs:

  training-update:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # CHECKOUT REPOSITORY
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # SETUP PYTHON
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------
      # INSTALL DEPENDENCIES
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------
      # DETERMINE RUN MODE
      # ------------------------------------------------------

      - name: Determine run mode
        id: mode
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "mode=${{ inputs.run_mode }}" >> $GITHUB_OUTPUT

          elif [ "${{ github.event.schedule }}" = "50 6 * * 1-5" ]; then

            echo "mode=morning" >> $GITHUB_OUTPUT

          elif [ "${{ github.event.schedule }}" = "50 17 * * 1-5" ]; then

            echo "mode=evening" >> $GITHUB_OUTPUT

          else

            echo "mode=weekend" >> $GITHUB_OUTPUT

          fi

      # ------------------------------------------------------
      # RUN AI ENGINE
      # ------------------------------------------------------

      - name: Run Korlink Training Update
        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          RUN_MODE: ${{ steps.mode.outputs.mode }}

        run: |

          python main.py

      # ------------------------------------------------------
      # SAVE GENERATED DATA
      # ------------------------------------------------------

      - name: Save generated logs
        run: |

          git config user.name "Korlink Training Bot"

          git config user.email "actions@github.com"

          git add logs/

          git diff --cached --quiet || git commit -m "Update training content"

          git push
