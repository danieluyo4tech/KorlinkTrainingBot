name: Korlink Training Update AI

on:
  schedule:
    # 4:00 AM Nigeria Time (WAT, UTC+1)
    - cron: "0 3 * * *"

    # 4:00 PM Nigeria Time (WAT, UTC+1)
    - cron: "0 15 * * *"

  workflow_dispatch:
    inputs:
      run_mode:
        description: "Select the type of update to run"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening
          - weekend

permissions:
  contents: write

concurrency:
  group: korlink-training-update
  cancel-in-progress: false

jobs:
  training-update:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # CHECKOUT REPOSITORY
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # SET UP PYTHON
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ------------------------------------------------------
      # INSTALL DEPENDENCIES
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------
      # DETERMINE RUN MODE
      # ------------------------------------------------------

      - name: Determine run mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.run_mode }}"
          else
            HOUR=$(date -u +%H)

            if [ "$HOUR" = "03" ]; then
              MODE="morning"
            elif [ "$HOUR" = "15" ]; then
              MODE="evening"
            else
              DAY=$(date -u +%u)

              if [ "$DAY" = "6" ] || [ "$DAY" = "7" ]; then
                MODE="weekend"
              else
                echo "No scheduled mode matched."
                exit 1
              fi
            fi
          fi

          echo "RUN_MODE=$MODE" >> "$GITHUB_ENV"

          echo "Selected run mode: $MODE"

      # ------------------------------------------------------
      # RUN KORLINK TRAINING UPDATE
      # ------------------------------------------------------

      - name: Run training update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ env.RUN_MODE }}
        run: |
          python main.py

      # ------------------------------------------------------
      # SAVE GENERATED LOGS
      # ------------------------------------------------------

      - name: Commit generated logs
        shell: bash
        run: |
          git config user.name "Korlink Technologies"
          git config user.email "actions@users.noreply.github.com"

          git add logs/questions.json logs/posts.json

          if git diff --cached --quiet; then
            echo "No log changes to commit."
            exit 0
          fi

          git commit -m "Update training content logs"

      # ------------------------------------------------------
      # PUSH LOGS TO REPOSITORY
      # ------------------------------------------------------

      - name: Push generated logs
        shell: bash
        run: |
          git push
